services:
  postgres:
    image: postgres:16-alpine
    container_name: zorbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zorbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zorbit_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-zorbit_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zorbit} -d ${POSTGRES_DB:-zorbit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

