[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation"
version = "0.1.0"
description = "COLLIVRA Simulation Package: Simplified Synthetic Fragmentation, Risk Scoring, and Clohessy-Wiltshire Remediation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Member 3 - Simulation & Remediation Lead" }]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "orbital_core>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulation*"]

