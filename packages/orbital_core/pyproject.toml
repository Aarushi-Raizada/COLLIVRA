[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital_core"
version = "0.1.0"
description = "COLLIVRA Core Orbital Mechanics, CelesTrak Ingestion, SGP4, and Astropy Frame Conversions"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Member 2 - Backend & Orbital Mechanics Lead" }]
dependencies = [
    "sgp4>=2.23",
    "astropy>=6.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orbital_core*"]

