[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collivra-monorepo"
version = "0.1.0"
description = "Monorepo root for COLLIVRA Space Situational Awareness and Orbital Sustainability Platform"
authors = [
    { name = "Pranjal Bhatnagar" },
    { name = "Mahi Gupta" },
    { name = "Aarushi Raizada" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = [
    "packages/orbital_core",
    "packages/simulation",
    "apps/api"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

